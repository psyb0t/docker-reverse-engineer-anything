title: reverse-engineer-anything
tagline: REA in Docker with the Android toolchain and an HTTP MCP endpoint
description: A Docker image that packages REA (rea-agents) with JDK 21, JADX, Apktool and adb for APK analysis, Ghidra on demand, and a token-guarded Streamable HTTP MCP bridge.
lang: en
url: https://psyb0t.github.io
baseurl: /docker-reverse-engineer-anything
repository: psyb0t/docker-reverse-engineer-anything
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/docker-reverse-engineer-anything
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/docker-reverse-engineer-anything/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/docker-reverse-engineer-anything
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
