name: pipeline

on: [push]

jobs:
  # Lint, bridge unit tests, then the built image against a real APK (REA's
  # Android tools through the HTTP bridge). A tag reuses the default-branch run
  # of the same commit instead of testing it again.
  checks:
    if: github.ref_type == 'branch'
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/make-checks.yml@master

  # The same image test on a native arm64 runner: REA has only verified its
  # Android path on x86-64, so arm64 is proven here rather than assumed. It runs
  # after `checks` because make-checks.yml uses one concurrency group per ref,
  # and a second concurrent call would cancel the first.
  checks-arm64:
    needs: [checks]
    if: github.ref_type == 'branch'
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/make-checks.yml@master
    with:
      runs_on: ubuntu-24.04-arm
      lint_command: "-"
      test_command: "make test-integration"

  # The default branch builds the image once and also tags it sha-<commit>,
  # so a release tag on that commit can promote it instead of rebuilding.
  call-docker-image-workflow:
    needs: [checks, checks-arm64]
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write # GitHub Release
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/reverse-engineer-anything
      target_platforms: "linux/amd64,linux/arm64"
      push_sha_tag: true
      # Report scan findings to the Security tab but don't fail the run.
      scan_fail_build: false
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  badges:
    needs: [call-docker-image-workflow]
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  # A release tag waits for the default-branch run of its commit, which
  # already tested and built it, then promotes that image by digest.
  wait-for-default-branch:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master

  promote-image:
    needs: [wait-for-default-branch]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # The called workflow's release job asks for write even when
      # create_release turns it off, and GitHub checks that up front.
      contents: write
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/reverse-engineer-anything
      target_platforms: "linux/amd64,linux/arm64"
      promote_on_tag: true
      # The release job below cuts the release from the tag's own notes.
      create_release: false
      scan_fail_build: false
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    needs: [promote-image]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  release-badges:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  # Publish the skill to ClawHub on tag pushes only, after the image it runs is
  # promoted on Docker Hub.
  publish-to-clawhub:
    needs: [promote-image]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["reverse-engineer-anything"]'
      plugin_names: "[]"
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  publish-to-mcp-registry:
    needs: [promote-image]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # secretless OIDC auth to the registry
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/mcp-registry-publish.yml@master
