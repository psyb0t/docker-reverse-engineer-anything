name: pipeline

# Every branch push runs lint, the bridge unit tests and the image integration
# test on amd64, then the integration test again on a native arm64 runner. A
# push to main then builds the image for both architectures and publishes
# :latest and :sha-<commit>. A v* tag does not test or build again: it waits for
# that commit's main run to succeed, promotes the same image digest to the
# release tag, cuts the GitHub release, and publishes the skill and the MCP
# registry entry.
on: [push]

permissions: {}

jobs:
  # Lint, bridge unit tests, then the built image against a real APK (REA's
  # Android tools through the HTTP bridge) and Ghidra native analysis. Every
  # tool runs in a container, so the runner needs only Docker, Make and Bash.
  code:
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test"

  # The same image test on a native arm64 runner: REA has only verified its
  # Android path on x86-64, so arm64 is proven here rather than assumed. It runs
  # after `code` because code-workflow.yml takes its concurrency group from this
  # workflow, event and ref, and a second concurrent call would cancel the first.
  code-arm64:
    needs: [code]
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      runs_on: ubuntu-24.04-arm
      test_command: "make test-integration"

  badges:
    needs: [code, wait]
    if: "always() && ((github.ref_name == github.event.repository.default_branch && needs.code.result == 'success') || (startsWith(github.ref, 'refs/tags/') && needs.wait.result == 'success'))"
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  # The called workflow builds only on main/master or tags, so other branches
  # stop after the code jobs. main also tags the image sha-<commit>, so a
  # release tag on that commit can promote it instead of rebuilding.
  call-docker-image-workflow:
    needs: [code, code-arm64]
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: write # GitHub Release
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/reverse-engineer-anything
      target_platforms: "linux/amd64,linux/arm64"
      push_sha_tag: true
      # Report scan findings to the Security tab without failing the run, so
      # a tag release can still promote this build.
      scan_fail_build: false
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # A release tag waits for the main run of its commit, which already tested
  # and built it.
  wait:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master

  docker-promote:
    needs: [wait]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # The called workflow's release job asks for write even when
      # create_release turns it off, and GitHub checks that up front.
      contents: write
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/reverse-engineer-anything
      target_platforms: "linux/amd64,linux/arm64"
      promote_on_tag: true
      # The release job below cuts the release from the tag's own notes.
      create_release: false
      scan_fail_build: false
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    needs: [docker-promote]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  # Publish the skill to ClawHub once the release and the image it runs exist.
  publish-to-clawhub:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["reverse-engineer-anything"]'
      plugin_names: "[]"
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  publish-to-mcp-registry:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # secretless OIDC auth to the registry
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/mcp-registry-publish.yml@master
